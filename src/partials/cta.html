<!-- XStore / Elementor: sekcija su fono video, Heading + Contact Form 7 stiklo kortelėje -->
<section class="sec sec--tight" id="uzklausa">
  <div class="cta on-dark" data-band>
    <div class="cta__media" data-plx="8"><video muted loop playsinline preload="none" poster="assets/video/cta-road.webp" data-src="assets/video/cta-road.mp4" data-autoplay aria-hidden="true"></video></div>
    <div class="cta__in wrap">
      <div>
        <p class="eyebrow">Užklausa</p>
        <h2 class="h2" data-split>Turite krovinį? <em>Suplanuokime</em> maršrutą.</h2>
        <p class="lead" data-rv>Parašykite, ką, iš kur ir kada reikia vežti. Parinksime puspriekabę, suplanuosime maršrutą ir pateiksime pasiūlymą.</p>
        <div class="cta__lines" data-rv style="--d:.1s">
          <a href="tel:{{c_tel_href}}">{{c_tel}} {{i:arrow-up-right}}</a>
          <a href="mailto:{{c_mail_road}}">{{c_mail_road}} {{i:arrow-up-right}}</a>
        </div>
      </div>
      <div class="glass" data-rv="scale" data-tilt="4">
        {{> qform}}
      </div>
    </div>
  </div>
</section>
